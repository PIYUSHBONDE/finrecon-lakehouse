services:
  postgres:
    image: postgres:16-alpine
    container_name: finrecon_postgres
    environment:
      POSTGRES_DB: finrecon
      POSTGRES_USER: finrecon
      POSTGRES_PASSWORD: finrecon
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finrecon_kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_ZOOKEEPER_CONNECT: ''
      CLUSTER_ID: 'Mk3OEYBSD3TfxwCVKBZhSg=='

  debezium:
    image: quay.io/debezium/connect:2.4.0.Final
    container_name: finrecon_debezium
    ports:
      - "8083:8083"
    environment:
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offset
      STATUS_STORAGE_TOPIC: debezium_status
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium_connect_group
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - postgres
      - kafka

  bronze:
    profiles: ["compute"]
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    image: finrecon-spark:3.5.7-delta3.3.2
    working_dir: /workspace
    cpus: 2
    mem_limit: 3g
    environment:
      PYSPARK_PYTHON: python3
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_IVY_DIR: /opt/spark-ivy
    volumes:
      - ../:/workspace
      - bronze_data:/lakehouse
      - spark_ivy:/opt/spark-ivy
    ports:
      - "4040:4040"

volumes:
  pgdata:
  kafka_data:
  bronze_data:
  spark_ivy:
